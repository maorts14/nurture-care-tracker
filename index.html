<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3654b" />
    <meta name="description" content="Feedme brings feeds, diaper changes, notes, reminders and caregivers into one shared child-care timeline." />
    <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <title>Feedme — shared care</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const locale = localStorage.getItem("feedme_locale") === "he" || navigator.language.startsWith("he") ? "he" : "en";
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "he" ? "rtl" : "ltr";
        const appRoot = document.getElementById("root");
        appRoot.lang = locale;
        appRoot.dir = locale === "he" ? "rtl" : "ltr";
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
