name: Publish release images

on:
  create:

permissions:
  contents: read
  packages: write

concurrency:
  group: feedme-production
  cancel-in-progress: false

jobs:
  verify:
    name: Type-check and build
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

  publish:
    name: Publish immutable release images
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: server/Dockerfile
          - name: web
            dockerfile: web.Dockerfile
          - name: db
            dockerfile: server/db.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must use semver, for example 1.0.1 or 1.0.1-rc.1." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/maorts14/feedme-${{ matrix.name }}:${{ steps.version.outputs.version }}
            ghcr.io/maorts14/feedme-${{ matrix.name }}:sha-${{ github.sha }}
            ghcr.io/maorts14/feedme-${{ matrix.name }}:latest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy latest images to production
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ubuntu@148.113.44.137 'cd /opt/nurture && ./scripts/deploy.sh'

      - name: Verify production health
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          health="$(curl --fail --retry 12 --retry-all-errors --retry-delay 5 --show-error \
            https://feedme-baby.com/api/health)"
          echo "$health"
          node -e 'const health = JSON.parse(process.argv[1]); const expectedVersion = process.env.EXPECTED_VERSION.slice(1); if (health.version !== expectedVersion) { throw new Error(`Production reports version ${health.version}; expected ${expectedVersion}.`); }' "$health"
