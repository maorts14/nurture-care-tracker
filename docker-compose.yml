services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nurture}
      POSTGRES_USER: ${POSTGRES_USER:-nurture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nurture_local_only}
    ports: ["5432:5432"]
    volumes:
      - nurture_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: sh -c "node --import tsx server/migrate.ts && npx nodemon --legacy-watch --watch server --ext ts,json --exec 'node --inspect=0.0.0.0:9229 --import tsx server/index.ts'"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-nurture}:${POSTGRES_PASSWORD:-nurture_local_only}@db:5432/${POSTGRES_DB:-nurture}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
      - "9229:9229"
    volumes:
      - ./server:/app/server
      - ./tsconfig.server.json:/app/tsconfig.server.json:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: web.Dockerfile.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
volumes:
  nurture_data:
  web_node_modules:
